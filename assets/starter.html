<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[PAGE TITLE]</title>
  <style>
    :root {
      --bg: #f3efe7;     /* neutral background */
      --ink: #1d1b18;    /* main text */
      --accent: #c8553d; /* the single accent */
    }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
                 font-family: system-ui, sans-serif; }
    .hero { position: relative; height: 100%; min-height: 480px; }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .copy { position: absolute; left: 24px; bottom: 24px; max-width: 360px;
            background: var(--bg); padding: 16px 18px; border: 2px solid var(--ink); }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; line-height: 1.5; }
    .cta { display: inline-block; padding: 10px 16px; background: var(--accent); color: #fff;
           text-decoration: none; border: 2px solid var(--ink); }
    .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .fallback { display: none; padding: 24px 24px 0; margin: 0; }
    .no-webgl #stage { display: none; }
    .no-webgl .fallback { display: block; }
    /* Without WebGL the copy box joins the normal page flow instead of floating over an empty stage. */
    .no-webgl .hero { height: auto; }
    .no-webgl .copy { position: static; margin: 16px 24px 24px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main class="hero">
    <div id="stage" role="img" aria-label="[SHORT DESCRIPTION OF WHAT IS VISIBLE AND WHAT IT IS FOR]"></div>

    <p class="fallback" role="status">The 3D view is not available on this device. The main content is still readable below.</p>

    <section class="copy">
      <h1>[MAIN HEADING]</h1>
      <p>[One sentence that explains the benefit.]</p>
      <a class="cta" href="#">[Primary action]</a>
    </section>

  </main>

  <script type="module">
    import * as THREE from 'three';

    const stage = document.getElementById('stage');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    // All 3D setup lives in one function so the fallback can exit cleanly.
    function startScene() {
      // 1. Create the renderer inside try/catch. If WebGL is missing, show the text fallback.
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (err) {
        document.body.classList.add('no-webgl');
        console.warn('WebGL is not available, showing the text content:', err.message);
        return;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      stage.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(getComputedStyle(document.documentElement)
        .getPropertyValue('--bg').trim());

      // 2. Orthographic camera (isometric example). Change it to match your style.
      const VIEW = 6;
      const camera = new THREE.OrthographicCamera(-VIEW, VIEW, VIEW, -VIEW, 0.1, 200);
      camera.position.set(20, 20, 20);
      camera.lookAt(0, 0, 0);

      // 3. Lights
      scene.add(new THREE.HemisphereLight(0xffffff, 0x9b8f80, 1.1));
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(-6, 12, 4);
      scene.add(sun);

      // 4. Example object (replace with real content)
      const block = new THREE.Mesh(
        new THREE.BoxGeometry(2, 2, 2),
        new THREE.MeshLambertMaterial({ color: 0x3f7d6b })
      );
      block.position.y = 1;
      scene.add(block);

      // 5. Resize: size comes from the container, the frustum follows the aspect ratio
      function resize() {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        renderer.setSize(w, h, false);
        const aspect = w / h;
        camera.left = -VIEW * aspect;
        camera.right = VIEW * aspect;
        camera.top = VIEW;
        camera.bottom = -VIEW;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }
      window.addEventListener('resize', resize);

      // 6. Loop: stops while the tab is hidden; moves only if reduced motion is off
      let t0 = performance.now();
      function frame(now) {
        const dt = (now - t0) / 1000;
        t0 = now;
        if (!reduceMotion.matches) {
          block.rotation.y += dt * 0.2; // slow motion, as an example
        }
        renderer.render(scene, camera);
      }
      function syncLoop() {
        renderer.setAnimationLoop(document.hidden ? null : frame);
      }
      document.addEventListener('visibilitychange', syncLoop);
      reduceMotion.addEventListener('change', () => renderer.render(scene, camera));

      resize();
      syncLoop();
    }

    startScene();
  </script>
</body>
</html>
